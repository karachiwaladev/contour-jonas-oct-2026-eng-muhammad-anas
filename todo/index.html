<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --accent: #2563eb; --border: #e5e7eb; --danger: #dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #181b22; --text: #e6e8ee; --muted: #9aa1ad; --accent: #60a5fa; --border: #2a2f3a; --danger: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 520px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 1.6rem; margin: 0 0 16px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; }
  button { font: inherit; border: 0; border-radius: 8px; cursor: pointer; }
  .add { padding: 10px 16px; background: var(--accent); color: #fff; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
  li span { flex: 1; word-break: break-word; }
  li.done span { text-decoration: line-through; color: var(--muted); }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .delete { background: none; color: var(--danger); padding: 4px 8px; }
  .empty, .count { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Todo</h1>
  <form id="new-task">
    <input type="text" id="title" placeholder="What needs doing?" autocomplete="off" required>
    <button class="add" type="submit">Add</button>
  </form>
  <ul id="list"></ul>
  <p class="empty" id="empty">No tasks yet.</p>
  <p class="count" id="count"></p>
</main>
<script>
// Tasks live in IndexedDB (a client-side database), so they persist across reloads.
const DB_NAME = 'todo-app';
const STORE = 'tasks';

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function run(db, mode, fn) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, mode);
    const req = fn(tx.objectStore(STORE));
    tx.oncomplete = () => resolve(req && req.result);
    tx.onerror = () => reject(tx.error);
  });
}

const tasks = {
  all: db => run(db, 'readonly', s => s.getAll()),
  add: (db, title) => run(db, 'readwrite', s => s.add({ title, done: false, createdAt: Date.now() })),
  put: (db, task) => run(db, 'readwrite', s => s.put(task)),
  remove: (db, id) => run(db, 'readwrite', s => s.delete(id)),
};

const list = document.getElementById('list');
const empty = document.getElementById('empty');
const count = document.getElementById('count');

function render(db, items) {
  list.replaceChildren(...items.map(task => {
    const li = document.createElement('li');
    li.className = task.done ? 'done' : '';

    const check = document.createElement('input');
    check.type = 'checkbox';
    check.checked = task.done;
    check.setAttribute('aria-label', 'Mark done');
    check.onchange = async () => { await tasks.put(db, { ...task, done: check.checked }); refresh(db); };

    const title = document.createElement('span');
    title.textContent = task.title;

    const del = document.createElement('button');
    del.className = 'delete';
    del.textContent = 'Delete';
    del.onclick = async () => { await tasks.remove(db, task.id); refresh(db); };

    li.append(check, title, del);
    return li;
  }));
  empty.hidden = items.length > 0;
  const left = items.filter(t => !t.done).length;
  count.textContent = items.length ? `${left} of ${items.length} left` : '';
}

async function refresh(db) {
  render(db, await tasks.all(db));
}

openDb().then(db => {
  document.getElementById('new-task').onsubmit = async e => {
    e.preventDefault();
    const input = document.getElementById('title');
    const title = input.value.trim();
    if (!title) return;
    await tasks.add(db, title);
    input.value = '';
    refresh(db);
  };
  refresh(db);
});
</script>
</body>
</html>
