<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Flat design, teal palette (ui-ux-pro-max "Todo" design system). */
  :root {
    --primary: #0F766E;          /* teal-700: 5.5:1 with white text */
    --primary-hover: #115E59;
    --secondary: #14B8A6;
    --bg: #F0FDFA;
    --fg: #134E4A;
    --card: #FFFFFF;
    --muted: #E8F1F4;
    --muted-fg: #475569;
    --border: #CCFBF1;
    --border-strong: #99F6E4;
    --destructive: #DC2626;
    --warning: #B45309;          /* amber-700: medium priority */
    --ring: #0D9488;
    --radius: 12px;
    --ease: 180ms ease;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #14B8A6;
      --primary-hover: #2DD4BF;
      --bg: #042F2E;
      --fg: #CCFBF1;
      --card: #083F3C;
      --muted: #0B4A46;
      --muted-fg: #94A3B8;
      --border: #115E59;
      --border-strong: #0F766E;
      --destructive: #F87171;
      --warning: #FBBF24;
      --ring: #2DD4BF;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --ease: 0s; }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 56px 16px 40px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
  .count { color: var(--muted-fg); font-size: .9rem; font-weight: 500; }

  /* New task */
  #new-task { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 20px; }
  #new-task .details { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
  #new-task .details .tag-editor { flex: 1 1 180px; }
  input[type=date] {
    height: 44px; padding: 0 12px; flex: none;
    background: var(--card); color: var(--fg);
    border: 2px solid var(--border); border-radius: var(--radius); font: inherit; font-size: .9rem;
  }
  input[type=date]:focus { outline: none; border-color: var(--ring); }
  select {
    height: 44px; padding: 0 10px; flex: none;
    background: var(--card); color: var(--fg);
    border: 2px solid var(--border); border-radius: var(--radius); font: inherit; font-size: .9rem; cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--ring); }

  /* Tag chip editor */
  .tag-editor {
    flex: 1; min-width: 0; min-height: 44px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 4px 8px; background: var(--card);
    border: 2px solid var(--border); border-radius: var(--radius); cursor: text;
  }
  .tag-editor:focus-within { border-color: var(--ring); }
  .tag-editor input { flex: 1; min-width: 90px; height: 32px; border: 0; outline: none; background: none; color: var(--fg); font: inherit; font-size: .9rem; }
  .tag-editor input::placeholder { color: var(--muted-fg); }
  .chip {
    display: inline-flex; align-items: center; gap: 2px; height: 26px; padding: 0 4px 0 10px;
    border-radius: 999px; background: var(--muted); color: var(--fg); font-size: .8rem; font-weight: 600;
  }
  .chip button { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; color: var(--muted-fg); }
  .chip button:hover { color: var(--destructive); }
  .chip svg { width: 12px; height: 12px; }
  .field { flex: 1; position: relative; }
  .field input {
    width: 100%; height: 48px; padding: 0 16px;
    background: var(--card); color: var(--fg);
    border: 2px solid var(--border); border-radius: var(--radius);
    font: inherit; transition: border-color var(--ease);
  }
  .field input::placeholder { color: var(--muted-fg); }
  .field input:focus { outline: none; border-color: var(--ring); }

  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  :focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

  .add {
    display: inline-flex; align-items: center; gap: 6px;
    height: 48px; padding: 0 18px;
    background: var(--primary); color: #fff;
    border-radius: var(--radius); font-weight: 600;
    transition: background-color var(--ease);
  }
  @media (prefers-color-scheme: dark) { .add { color: #042F2E; } }
  .add:hover { background: var(--primary-hover); }
  .add svg { width: 20px; height: 20px; }

  /* Filters */
  .search {
    width: 100%; height: 44px; padding: 0 12px; margin-bottom: 12px; box-sizing: border-box;
    background: var(--card); color: var(--fg);
    border: 2px solid var(--border); border-radius: var(--radius); font: inherit; font-size: .9rem;
  }
  .search::placeholder { color: var(--muted-fg); }
  .search:focus { outline: none; border-color: var(--ring); }
  .filters { display: flex; gap: 4px; padding: 4px; margin-bottom: 16px; background: var(--muted); border-radius: var(--radius); }
  .filters button {
    flex: 1; min-height: 40px; border-radius: 9px;
    color: var(--muted-fg); font-weight: 600; font-size: .9rem;
    transition: background-color var(--ease), color var(--ease);
  }
  .filters button:hover { color: var(--fg); }
  .filters button[aria-pressed="true"] { background: var(--card); color: var(--fg); }

  .tag-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -4px 0 16px; }
  .tag-filters .label { color: var(--muted-fg); font-size: .85rem; font-weight: 600; margin-right: 2px; }
  .tag-filters button[data-tag], .tag-filters button[data-priority] {
    min-height: 32px; padding: 0 12px; border-radius: 999px;
    border: 2px solid var(--border); background: var(--card); color: var(--muted-fg); font-size: .85rem; font-weight: 600;
    transition: background-color var(--ease), color var(--ease), border-color var(--ease);
  }
  .tag-filters button[data-tag]:hover, .tag-filters button[data-priority]:hover { border-color: var(--border-strong); color: var(--fg); }
  .tag-filters button[data-tag][aria-pressed="true"], .tag-filters button[data-priority][aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
  @media (prefers-color-scheme: dark) { .tag-filters button[aria-pressed="true"]:is([data-tag], [data-priority]) { color: #042F2E; } }
  .tag-filters .clear { min-height: 32px; padding: 0 8px; color: var(--muted-fg); font-size: .85rem; text-decoration: underline; }

  /* List */
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li {
    display: flex; align-items: center; gap: 12px;
    min-height: 56px; padding: 6px 6px 6px 14px;
    background: var(--card); border: 2px solid var(--border); border-radius: var(--radius);
    transition: border-color var(--ease);
  }
  li:hover { border-color: var(--border-strong); }

  .check {
    flex: none; display: grid; place-items: center;
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--secondary);
    transition: background-color var(--ease), border-color var(--ease);
  }
  .check svg { width: 16px; height: 16px; color: #fff; opacity: 0; transition: opacity var(--ease); }
  .check:hover { background: var(--muted); }
  li.done .check { background: var(--primary); border-color: var(--primary); }
  li.done .check svg { opacity: 1; }
  @media (prefers-color-scheme: dark) { .check svg { color: #042F2E; } }

  .body { flex: 1; min-width: 0; }
  .title { overflow-wrap: anywhere; font-weight: 500; transition: color var(--ease); }
  li.done .title { color: var(--muted-fg); text-decoration: line-through; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .meta:empty { display: none; }
  .due { display: inline-flex; align-items: center; gap: 4px; color: var(--muted-fg); font-size: .8rem; font-weight: 500; }
  .due svg { width: 14px; height: 14px; }
  .due.overdue { color: var(--destructive); font-weight: 700; }
  .repeat { display: inline-flex; align-items: center; gap: 4px; color: var(--secondary); font-size: .8rem; font-weight: 600; }
  .repeat svg { width: 14px; height: 14px; }
  .priority { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; font-weight: 700; }
  .priority svg { width: 14px; height: 14px; }
  .priority.high { color: var(--destructive); }
  .priority.medium { color: var(--warning); }
  .priority.low { color: var(--muted-fg); }
  .meta .tag {
    height: 22px; padding: 0 8px; border-radius: 999px; background: var(--muted); color: var(--fg);
    font-size: .75rem; font-weight: 600; transition: background-color var(--ease);
  }
  .meta .tag:hover { background: var(--border-strong); }

  .icon-btn {
    flex: none; display: grid; place-items: center;
    width: 44px; height: 44px; border-radius: 10px;
    color: var(--muted-fg); transition: color var(--ease), background-color var(--ease);
  }
  .icon-btn:hover { color: var(--fg); background: var(--muted); }
  .icon-btn svg { width: 20px; height: 20px; }

  /* Inline edit */
  li.editing { display: block; padding: 12px; }
  .edit-form { display: grid; gap: 8px; }
  .edit-form .title-input {
    height: 44px; padding: 0 12px; background: var(--card); color: var(--fg);
    border: 2px solid var(--border); border-radius: var(--radius); font: inherit;
  }
  .edit-form .title-input:focus { outline: none; border-color: var(--ring); }
  .edit-form .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .edit-form .row .tag-editor { flex: 1 1 180px; }
  .edit-form .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .btn { height: 40px; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: .9rem; }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #042F2E; } }
  .btn.ghost { color: var(--muted-fg); }
  .btn.ghost:hover { background: var(--muted); color: var(--fg); }

  .delete {
    flex: none; display: grid; place-items: center;
    width: 44px; height: 44px; border-radius: 10px;
    color: var(--muted-fg); transition: color var(--ease), background-color var(--ease);
  }
  .delete:hover { color: var(--destructive); background: var(--muted); }
  .delete svg { width: 20px; height: 20px; }

  /* Empty state */
  .empty { text-align: center; padding: 40px 16px; color: var(--muted-fg); }
  .empty svg { width: 48px; height: 48px; color: var(--secondary); margin-bottom: 8px; }
  .empty p { margin: 0; }
  .empty strong { display: block; color: var(--fg); font-weight: 600; margin-bottom: 2px; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 420px) {
    main { padding-top: 32px; }
    h1 { font-size: 1.6rem; }
    .add span { display: none; }
    .add { padding: 0 14px; }
    #new-task .details, .edit-form .row { flex-direction: column; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Todo</h1>
    <span class="count" id="count" aria-live="polite"></span>
  </header>

  <form id="new-task">
    <div class="field">
      <label for="title" class="sr-only">New task</label>
      <input type="text" id="title" placeholder="What needs doing?" autocomplete="off" maxlength="200" required>
    </div>
    <button class="add" type="submit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Add</span>
    </button>
    <div class="details">
      <input type="date" id="due" aria-label="Due date">
      <select id="repeat" aria-label="Repeat">
        <option value="none">No repeat</option>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
      </select>
      <select id="priority" aria-label="Priority">
        <option value="none">No priority</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <div id="new-tags"></div>
    </div>
  </form>

  <input type="search" id="search" class="search" placeholder="Search tasks…" aria-label="Search tasks by title or tag" autocomplete="off">

  <div class="filters" role="group" aria-label="Filter tasks">
    <button type="button" data-filter="all" aria-pressed="true">All</button>
    <button type="button" data-filter="active" aria-pressed="false">Incomplete</button>
    <button type="button" data-filter="done" aria-pressed="false">Completed</button>
  </div>
  <div class="tag-filters" id="priority-filters" role="group" aria-label="Filter by priority"></div>
  <div class="tag-filters" id="tag-filters" role="group" aria-label="Filter by tag" hidden></div>
  <datalist id="known-tags"></datalist>

  <ul id="list"></ul>

  <div class="empty" id="empty" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
    <p><strong id="empty-title">No tasks yet</strong><span id="empty-hint">Add your first one above.</span></p>
  </div>
</main>

<template id="task-template">
  <li>
    <button type="button" class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
    </button>
    <div class="body">
      <div class="title"></div>
      <div class="meta"></div>
    </div>
    <button type="button" class="icon-btn edit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
    </button>
    <button type="button" class="delete">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
    </button>
  </li>
</template>

<script>
// Tasks live in IndexedDB (a client-side database), so they persist across reloads.
// A task is {id, title, done, createdAt, due: 'YYYY-MM-DD' | '', tags: string[],
//   repeat: 'none' | 'daily' | 'weekly' | 'monthly', repeatDay?: number, spawnedNext?: boolean,
//   priority: 'high' | 'medium' | 'low' | 'none'}.
// Tasks saved before a field existed lack it and are read with defaults (no date, no tags, no repeat, no priority).
const DB_NAME = 'todo-app';
const STORE = 'tasks';

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function run(db, mode, fn) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, mode);
    const req = fn(tx.objectStore(STORE));
    tx.oncomplete = () => resolve(req && req.result);
    tx.onerror = () => reject(tx.error);
  });
}

const tasks = {
  all: db => run(db, 'readonly', s => s.getAll()),
  add: (db, task) => run(db, 'readwrite', s => s.add({ ...task, done: false, createdAt: Date.now() })),
  put: (db, task) => run(db, 'readwrite', s => s.put(task)),
  remove: (db, id) => run(db, 'readwrite', s => s.delete(id)),
};

const list = document.getElementById('list');
const empty = document.getElementById('empty');
const count = document.getElementById('count');
const template = document.getElementById('task-template');
const filterButtons = document.querySelectorAll('[data-filter]');
const tagFilters = document.getElementById('tag-filters');
const priorityFilters = document.getElementById('priority-filters');
const knownTags = document.getElementById('known-tags');
let filter = 'all';
let query = '';                   // search text (lowercased); matches title or any tag; resets on reload
const selectedTags = new Set();   // tag filter: show tasks having ANY of these
const selectedPriorities = new Set();   // priority filter: show tasks with ANY of these
let editingId = null;             // task currently shown as the inline edit form
let allTags = [];

const EMPTY_TEXT = {
  all: ['No tasks yet', 'Add your first one above.'],
  active: ['All caught up', 'Nothing left to do.'],
  done: ['Nothing done yet', 'Completed tasks show up here.'],
};
const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const ICON_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';

const normalizeTag = t => t.trim().toLowerCase().replace(/^#/, '').replace(/\s+/g, '-');

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function formatDue(due) {
  const [y, m, d] = due.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

const REPEAT_LABEL = { daily: 'Daily', weekly: 'Weekly', monthly: 'Monthly' };
const PRIORITIES = ['high', 'medium', 'low', 'none'];   // also the tie-break order
const PRIORITY_LABEL = { high: 'High', medium: 'Medium', low: 'Low', none: 'None' };
const ICON_FLAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22V4"/><path d="M4 4h13l-2 4 2 4H4"/></svg>';
const priorityOf = task => PRIORITIES.includes(task.priority) ? task.priority : 'none';
const ICON_REPEAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>';

function isoDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// Next due date of a recurring task. Monthly tasks keep their original day of the month
// (repeatDay) and clamp to the last day of shorter months: Jan 31 -> Feb 28 -> Mar 31.
function nextDue(due, repeat, repeatDay) {
  const [y, m, d] = due.split('-').map(Number);
  if (repeat === 'daily') return isoDate(new Date(y, m - 1, d + 1));
  if (repeat === 'weekly') return isoDate(new Date(y, m - 1, d + 7));
  const lastDay = new Date(y, m + 1, 0).getDate();   // last day of the following month
  return isoDate(new Date(y, m, Math.min(repeatDay || d, lastDay)));
}

// Fills in the fields a recurring task needs: a due date (today if none) and, for monthly, the anchor day.
function withRepeat(task) {
  const repeat = task.repeat || 'none';
  if (repeat === 'none') return { ...task, repeat, repeatDay: undefined };
  const due = task.due || today();
  return { ...task, repeat, due, repeatDay: repeat === 'monthly' ? (task.repeatDay || Number(due.split('-')[2])) : undefined };
}

// Ticking a recurring task done creates the next occurrence once. The flag stops a duplicate
// if the task is unticked and ticked again.
async function toggleDone(db, task) {
  const done = !task.done;
  if (done && task.repeat && task.repeat !== 'none' && task.due && !task.spawnedNext) {
    await tasks.put(db, { ...task, done, spawnedNext: true });
    await tasks.add(db, { title: task.title, tags: task.tags || [], repeat: task.repeat, repeatDay: task.repeatDay,
                          priority: priorityOf(task), due: nextDue(task.due, task.repeat, task.repeatDay) });
  } else {
    await tasks.put(db, { ...task, done });
  }
}

// Soonest due first, undated last; same date sorts by priority (High first), then the order tasks were added.
function byDue(a, b) {
  if ((a.due || '') !== (b.due || '')) {
    if (!a.due) return 1;
    if (!b.due) return -1;
    return a.due < b.due ? -1 : 1;
  }
  const rank = PRIORITIES.indexOf(priorityOf(a)) - PRIORITIES.indexOf(priorityOf(b));
  if (rank) return rank;
  return a.createdAt - b.createdAt;
}

// Chip editor: type a tag, press Enter or comma to add it; Backspace on an empty box removes the last one.
function tagEditor(initial = []) {
  const tags = [...initial];
  const el = document.createElement('div');
  el.className = 'tag-editor';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Add tags…';
  input.setAttribute('list', 'known-tags');
  input.setAttribute('aria-label', 'Tags (press Enter to add)');
  input.autocomplete = 'off';

  const draw = () => {
    el.replaceChildren(...tags.map(tag => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = `#${tag}`;
      const x = document.createElement('button');
      x.type = 'button';
      x.innerHTML = ICON_X;
      x.setAttribute('aria-label', `Remove tag ${tag}`);
      x.onclick = () => { tags.splice(tags.indexOf(tag), 1); draw(); input.focus(); };
      chip.append(x);
      return chip;
    }), input);
  };
  const commit = () => {
    for (const part of input.value.split(',')) {
      const tag = normalizeTag(part);
      if (tag && !tags.includes(tag)) tags.push(tag);
    }
    input.value = '';
    draw();
  };

  input.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ',') && input.value.trim()) { e.preventDefault(); commit(); input.focus(); }
    else if (e.key === 'Backspace' && !input.value && tags.length) { tags.pop(); draw(); input.focus(); }
  });
  input.addEventListener('input', () => { if (input.value.includes(',')) { commit(); input.focus(); } });
  el.onclick = e => { if (e.target === el) input.focus(); };
  draw();

  // Pending text counts as a tag when the form is saved.
  return { el, input, getTags: () => { commit(); return [...tags]; }, clear: () => { tags.length = 0; draw(); } };
}

function renderTagFilters(db) {
  for (const t of [...selectedTags]) if (!allTags.includes(t)) selectedTags.delete(t);
  tagFilters.hidden = allTags.length === 0;
  knownTags.replaceChildren(...allTags.map(t => Object.assign(document.createElement('option'), { value: t })));

  const label = Object.assign(document.createElement('span'), { className: 'label', textContent: 'Tags' });
  const buttons = allTags.map(tag => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.tag = tag;
    b.textContent = `#${tag}`;
    b.setAttribute('aria-pressed', selectedTags.has(tag));
    b.onclick = () => { selectedTags.has(tag) ? selectedTags.delete(tag) : selectedTags.add(tag); refresh(db); };
    return b;
  });
  const parts = [label, ...buttons];
  if (selectedTags.size) {
    const clear = Object.assign(document.createElement('button'), { type: 'button', className: 'clear', textContent: 'Clear' });
    clear.onclick = () => { selectedTags.clear(); refresh(db); };
    parts.push(clear);
  }
  tagFilters.replaceChildren(...parts);
}

function renderPriorityFilters(db) {
  const label = Object.assign(document.createElement('span'), { className: 'label', textContent: 'Priority' });
  const buttons = PRIORITIES.map(p => {
    const b = Object.assign(document.createElement('button'), { type: 'button', textContent: PRIORITY_LABEL[p] });
    b.dataset.priority = p;
    b.setAttribute('aria-pressed', selectedPriorities.has(p));
    b.onclick = () => { selectedPriorities.has(p) ? selectedPriorities.delete(p) : selectedPriorities.add(p); refresh(db); };
    return b;
  });
  const parts = [label, ...buttons];
  if (selectedPriorities.size) {
    const clear = Object.assign(document.createElement('button'), { type: 'button', className: 'clear', textContent: 'Clear' });
    clear.onclick = () => { selectedPriorities.clear(); refresh(db); };
    parts.push(clear);
  }
  priorityFilters.replaceChildren(...parts);
}

function editForm(db, task, li) {
  li.classList.add('editing');
  const form = document.createElement('form');
  form.className = 'edit-form';
  const title = Object.assign(document.createElement('input'), { type: 'text', className: 'title-input', value: task.title, required: true, maxLength: 200 });
  title.setAttribute('aria-label', 'Task title');
  const due = Object.assign(document.createElement('input'), { type: 'date', value: task.due || '' });
  due.setAttribute('aria-label', 'Due date');
  const tags = tagEditor(task.tags || []);
  const repeat = document.createElement('select');
  repeat.setAttribute('aria-label', 'Repeat');
  for (const [value, label] of [['none', 'No repeat'], ['daily', 'Daily'], ['weekly', 'Weekly'], ['monthly', 'Monthly']]) {
    repeat.append(Object.assign(document.createElement('option'), { value, textContent: label, selected: (task.repeat || 'none') === value }));
  }
  const priority = document.createElement('select');
  priority.setAttribute('aria-label', 'Priority');
  for (const p of PRIORITIES) {
    priority.append(Object.assign(document.createElement('option'), { value: p, textContent: p === 'none' ? 'No priority' : PRIORITY_LABEL[p], selected: priorityOf(task) === p }));
  }
  const row = document.createElement('div');
  row.className = 'row';
  row.append(due, repeat, priority, tags.el);
  const actions = document.createElement('div');
  actions.className = 'actions';
  const cancel = Object.assign(document.createElement('button'), { type: 'button', className: 'btn ghost', textContent: 'Cancel' });
  const save = Object.assign(document.createElement('button'), { type: 'submit', className: 'btn primary', textContent: 'Save' });
  actions.append(cancel, save);
  form.append(title, row, actions);

  const close = () => { editingId = null; refresh(db); };
  cancel.onclick = close;
  form.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); close(); } });
  form.onsubmit = async e => {
    e.preventDefault();
    const text = title.value.trim();
    if (!text) return;
    const changedRepeat = repeat.value !== (task.repeat || 'none') || due.value !== (task.due || '');
    await tasks.put(db, withRepeat({ ...task, title: text, due: due.value, tags: tags.getTags(), repeat: repeat.value,
                                     priority: priority.value, repeatDay: changedRepeat ? undefined : task.repeatDay }));
    close();
  };
  li.replaceChildren(form);
  title.focus();
}

function render(db, items) {
  allTags = [...new Set(items.flatMap(t => t.tags || []))].sort();
  renderTagFilters(db);
  renderPriorityFilters(db);
  const now = today();
  const visible = items
    .filter(t => filter === 'all' || (filter === 'done') === t.done)
    .filter(t => !selectedTags.size || (t.tags || []).some(tag => selectedTags.has(tag)))
    .filter(t => !selectedPriorities.size || selectedPriorities.has(priorityOf(t)))
    .filter(t => !query || t.title.toLowerCase().includes(query) || (t.tags || []).some(tag => tag.toLowerCase().includes(query)))
    .sort(byDue);

  list.replaceChildren(...visible.map(task => {
    const li = template.content.firstElementChild.cloneNode(true);
    li.dataset.id = task.id;
    if (task.id === editingId) { editForm(db, task, li); return li; }
    li.classList.toggle('done', task.done);
    li.querySelector('.title').textContent = task.title;

    const meta = li.querySelector('.meta');
    const p = priorityOf(task);
    if (p !== 'none') {
      const badge = document.createElement('span');
      badge.className = `priority ${p}`;
      badge.innerHTML = ICON_FLAG;
      badge.append(PRIORITY_LABEL[p]);
      badge.title = `${PRIORITY_LABEL[p]} priority`;
      badge.setAttribute('aria-label', badge.title);
      meta.append(badge);
    }
    if (task.due) {
      const overdue = !task.done && task.due < now;
      const due = document.createElement('span');
      due.className = overdue ? 'due overdue' : 'due';
      due.innerHTML = ICON_CAL;
      due.append(`${overdue ? 'Overdue · ' : 'Due '}${formatDue(task.due)}`);
      meta.append(due);
    }
    if (REPEAT_LABEL[task.repeat]) {
      const r = document.createElement('span');
      r.className = 'repeat';
      r.innerHTML = ICON_REPEAT;
      r.append(REPEAT_LABEL[task.repeat]);
      r.title = `Repeats ${REPEAT_LABEL[task.repeat].toLowerCase()}`;
      meta.append(r);
    }
    for (const tag of task.tags || []) {
      const t = Object.assign(document.createElement('button'), { type: 'button', className: 'tag', textContent: `#${tag}` });
      t.title = `Filter by #${tag}`;
      t.onclick = () => { selectedTags.add(tag); refresh(db); };
      meta.append(t);
    }

    const edit = li.querySelector('.edit');
    edit.setAttribute('aria-label', `Edit "${task.title}"`);
    edit.onclick = () => { editingId = task.id; refresh(db); };

    const check = li.querySelector('.check');
    check.setAttribute('aria-pressed', task.done);
    check.setAttribute('aria-label', `Mark "${task.title}" ${task.done ? 'not done' : 'done'}`);
    // Disable synchronously so a fast double-tap can't fire toggleDone twice on
    // the stale task (which would spawn two next occurrences); refresh rebuilds a fresh button.
    check.onclick = async () => { check.disabled = true; await toggleDone(db, task); refresh(db); };

    const del = li.querySelector('.delete');
    del.setAttribute('aria-label', `Delete "${task.title}"`);
    del.onclick = async () => { await tasks.remove(db, task.id); refresh(db); };

    return li;
  }));

  empty.hidden = visible.length > 0;
  [document.getElementById('empty-title').textContent, document.getElementById('empty-hint').textContent] =
    items.length && (selectedTags.size || selectedPriorities.size) ? ['No matching tasks', 'Try other tags or priorities, or clear the filters.'] : EMPTY_TEXT[filter];

  const left = items.filter(t => !t.done).length;
  count.textContent = items.length ? `${left} of ${items.length} left` : '';
}

async function refresh(db) {
  render(db, await tasks.all(db));
}

openDb().then(db => {
  const newTags = tagEditor();
  document.getElementById('new-tags').replaceWith(newTags.el);
  document.getElementById('new-task').onsubmit = async e => {
    e.preventDefault();
    const input = document.getElementById('title');
    const due = document.getElementById('due');
    const repeat = document.getElementById('repeat');
    const priority = document.getElementById('priority');
    const title = input.value.trim();
    if (!title) return;
    await tasks.add(db, withRepeat({ title, due: due.value, tags: newTags.getTags(), repeat: repeat.value, priority: priority.value }));
    input.value = due.value = '';
    repeat.value = priority.value = 'none';
    newTags.clear();
    input.focus();
    refresh(db);
  };

  filterButtons.forEach(btn => btn.onclick = () => {
    filter = btn.dataset.filter;
    filterButtons.forEach(b => b.setAttribute('aria-pressed', b === btn));
    refresh(db);
  });

  document.getElementById('search').addEventListener('input', e => {
    query = e.target.value.trim().toLowerCase();
    refresh(db);
  });

  refresh(db);
});
</script>
